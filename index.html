<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DrainWatch AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f6b65">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/clay.css">
  
  <style>
    /* App shell layout */
    .app-shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
    
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      transition: width 0.3s ease;
      z-index: 40;
    }
    .sidebar.collapsed { width: 80px; }
    
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .app-header {
      min-height: 72px;
      padding-top: env(safe-area-inset-top);
      flex-shrink: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }
    
    .app-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.5rem;
      padding-bottom: 100px;
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--surface-elevated);
    }
    
    .center-fab {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
    }

    @media (max-width: 767px) {
      .sidebar { display: none; }
      .app-header { height: 64px; }
    }
    @media (min-width: 768px) {
      .bottom-nav { display: none; }
      .app-content { padding-bottom: 1.5rem; }
    }
  </style>
</head>
<body class="antialiased">
  <div class="app-shell relative">
    
    <!-- Desktop Sidebar -->
    <aside id="sidebar" aria-label="Sidebar Navigation" class="sidebar hidden md:flex flex-col clay-panel rounded-none border-r border-[rgba(15,23,42,0.05)] h-full">
      <div class="h-[72px] flex items-center justify-between px-6">
        <div class="flex items-center gap-3 text-primary font-bold text-xl logo-text" aria-hidden="true">
          <i data-lucide="waves" class="text-[var(--color-primary)]"></i> 
          <span>DrainWatch</span>
        </div>
        <button id="toggle-sidebar" aria-label="Toggle Sidebar" class="p-2 rounded-lg hover:bg-black/5 transition-colors focus:ring-2 focus:ring-[var(--color-primary)]">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
      
      <nav class="flex-1 overflow-y-auto px-4 py-4 space-y-2 flex flex-col gap-1" id="sidebar-nav">
        <!-- Injected by JS -->
      </nav>
      
      <!-- Role Switcher -->
      <div class="p-4 border-t border-[rgba(15,23,42,0.05)]">
        <label class="block text-xs text-secondary mb-1 uppercase tracking-wider font-semibold">Mock Role</label>
        <select id="role-switcher" class="clay-input text-sm font-medium w-full cursor-pointer">
          <option value="citizen">Citizen</option>
          <option value="worker">Field Worker</option>
          <option value="officer">Municipal Officer</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- Header -->
      <header role="banner" class="app-header flex items-center justify-between px-4 md:px-8 border-b border-[rgba(15,23,42,0.05)] shadow-sm">
        <div class="flex items-center gap-4">
          <h1 id="page-title" class="text-card-title md:text-section-title font-semibold">Dashboard</h1>
        </div>
        
        <div class="flex items-center gap-3 md:gap-4">
          <div class="hidden md:flex relative w-64">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-secondary" aria-hidden="true"></i>
            <input type="search" aria-label="Global Search" placeholder="Search drain, ward or location..." class="clay-input pl-9 text-sm py-2 focus:ring-2 focus:ring-[var(--color-primary)]">
          </div>
          
          <div class="clay-badge severity-healthy hidden md:flex items-center gap-1 px-3 py-1.5 cursor-pointer">
            <i data-lucide="award" class="w-4 h-4"></i>
            <span id="header-credits">250</span> CC
          </div>
          
          <a href="#/notifications" class="relative p-2 rounded-full hover:bg-black/5 transition-colors">
            <i data-lucide="bell" class="w-5 h-5 text-secondary"></i>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-[var(--color-critical)] rounded-full border-2 border-white shadow-sm"></span>
          </a>
          
          <a href="#/profile" class="w-9 h-9 rounded-full bg-[var(--color-primary)] flex items-center justify-center text-white font-bold text-sm shadow-md cursor-pointer hover:opacity-90 transition-opacity">
            JD
          </a>
          
          <a href="#/report" class="hidden md:flex clay-btn py-2 px-4 text-sm whitespace-nowrap">
            <i data-lucide="plus" class="w-4 h-4"></i> Report
          </a>
        </div>
      </header>

      <!-- Main Content -->
      <main id="app-content" class="app-content relative z-10"></main>
    </div>
    
    <!-- Mobile Bottom Nav -->
    <nav role="navigation" aria-label="Mobile Bottom Navigation" class="bottom-nav md:hidden shadow-[0_-4px_24px_rgba(15,23,42,0.08)] rounded-t-3xl border-t border-[rgba(15,23,42,0.05)] flex items-center justify-around px-2">
      <a href="#/dashboard" aria-label="Home" class="mobile-nav-link flex flex-col items-center gap-1 p-2 text-secondary w-16 text-center focus:ring-2 focus:ring-[var(--color-primary)]" data-route="/dashboard">
        <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Home</span>
      </a>
      <a href="#/map" class="mobile-nav-link flex flex-col items-center gap-1 p-2 text-secondary w-16 text-center" data-route="/map">
        <i data-lucide="map" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Map</span>
      </a>
      
      <div class="w-16 relative flex justify-center">
        <a href="#/report" class="center-fab w-14 h-14 rounded-full bg-[var(--color-primary)] text-white shadow-lg flex items-center justify-center active:scale-95 transition-transform" data-route="/report" style="box-shadow: var(--clay-raised);">
          <i data-lucide="plus" class="w-6 h-6"></i>
        </a>
      </div>
      
      <a href="#/rewards" class="mobile-nav-link flex flex-col items-center gap-1 p-2 text-secondary w-16 text-center" data-route="/rewards">
        <i data-lucide="award" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Rewards</span>
      </a>
      <a href="#/profile" class="mobile-nav-link flex flex-col items-center gap-1 p-2 text-secondary w-16 text-center" data-route="/profile">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium">Profile</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(err => {
          console.warn('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
